name: Build & Deploy Automático

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  checks: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos TypeScript
        run: npm run typecheck

      - name: Compilar build de produção
        run: npm run build

      # Deploy opcional no Firebase Hosting via GitHub Action caso o segredo esteja configurado
      - name: Deploy no Firebase Hosting (se configurado)
        if: github.event_name == 'push' && env.FIREBASE_TOKEN != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: construtec-erp
