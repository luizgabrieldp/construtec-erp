<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#111A24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CONSTRUTEC ERP — Construção e reformas em geral</title>
    <!-- Favicons adaptativos e padrão ICO físico para navegadores (Safari, Chrome, Firefox) -->
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" id="favicon-32" type="image/png" sizes="32x32" href="/favicon-dark-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />

    <!-- Ícone PWA e Apple Touch Icon adaptativo (Branco no Modo Claro / Preto no Modo Escuro) -->
    <link rel="apple-touch-icon" id="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-dark.png?v=3" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=3" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Aplica o tema antes do primeiro paint (evita flash). NÃO usar type=module/defer. -->
    <script>
      {
        try {
          var pref = localStorage.getItem('construtec:theme') || 'system';
          var mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
          var dark = pref === 'dark' || (pref === 'system' && !!(mql && mql.matches));
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(dark ? 'dark' : 'light');
          var metaColor = document.querySelector('meta[name="color-scheme"]');
          if (metaColor) {
            metaColor.content = pref === 'system' ? 'light dark' : pref;
          }
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.content = dark ? '#111A24' : '#FFFFFF';
          }
          var appleTouch = document.getElementById('apple-touch-icon');
          if (appleTouch) {
            appleTouch.href = (dark ? '/apple-touch-icon-dark.png' : '/apple-touch-icon-light.png') + '?v=3';
          }
          var fav32 = document.getElementById('favicon-32');
          if (fav32) {
            fav32.href = (dark ? '/favicon-dark-32x32.png' : '/favicon-light-32x32.png') + '?v=3';
          }
        } catch (e) {}
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      function registerServiceWorker() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            if (reg && reg.update) {
              reg.update();
            }
          }).catch(function (err) {
            console.error('Service worker registration failed:', err);
          });
        }
      }
      if (document.readyState === 'complete') {
        registerServiceWorker();
      } else {
        window.addEventListener('load', registerServiceWorker);
      }
    </script>
  </body>
</html>
